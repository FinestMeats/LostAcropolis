name: Smoke test
on:
  pull_request:
  push:
    branches: [main]
# Least privilege: the test job only needs to read the code.
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (not tags) so a hijacked tag can't swap in different code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
